[package]
name = "libdoh"
version = "0.9.15"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "DoH and Oblivious DoH library for the rust-doh app"
keywords = ["dns", "https", "doh", "odoh", "proxy"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-doh"
repository = "https://github.com/jedisct1/rust-doh"
categories = ["asynchronous", "network-programming", "command-line-utilities"]
edition = "2018"

[features]
default = ["tls"]
tls = ["tokio-rustls"]

[dependencies]
anyhow = "1.0.100"
arc-swap = "1.8.1"
base64 = "0.22.1"
byteorder = "1.5.0"
bytes = "1.11.1"
futures = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", default-features = false, features = [
    "server",
    "http1",
    "http2",
] }
hyper-util = { version = "0.1.20", features = [
    "server",
    "server-auto",
    "http1",
    "http2",
    "tokio",
] }
hyper-rustls = { version = "0.27.7", features = ["http2"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
odoh-rs = "1.0.4"
rand = "0.9.2"
rustls-platform-verifier = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = [
    "net",
    "rt-multi-thread",
    "time",
    "sync",
] }
tokio-util = "0.7.18"
urlencoding = "2.1.3"
tokio-rustls = { version = "0.26.4", features = [
    "early-data",
], optional = true }
rustls-pemfile = "2.2.0"
tokio-quiche = "0.14.2"
url = "2.5.8"

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
